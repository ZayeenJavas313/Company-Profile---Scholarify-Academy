<!DOCTYPE html>
<html lang="id" style="scroll-behavior:smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Admin — Scholarify</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <style>
      .login-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--color-bg);
      }
      .login-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 24px 80px;
      }
      .login-card {
        width: 100%;
        max-width: 420px;
        background: var(--color-card-bg);
        border: 1px solid var(--color-card-border);
        border-radius: 20px;
        padding: 40px 36px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.15);
      }
      .login-logo {
        text-align: center;
        margin-bottom: 32px;
      }
      .login-logo a {
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 800;
        color: var(--color-card-text);
        text-decoration: none;
        letter-spacing: -0.5px;
      }
      .login-logo a sup {
        font-size: 0.5em;
        vertical-align: super;
      }
      .login-logo p {
        font-size: 14px;
        color: var(--color-muted);
        margin: 8px 0 0;
      }
      .login-title {
        font-family: var(--font-heading);
        font-size: 22px;
        font-weight: 700;
        color: var(--color-card-text);
        text-align: center;
        margin: 0 0 8px;
      }
      .login-subtitle {
        font-size: 14px;
        color: var(--color-muted);
        text-align: center;
        margin: 0 0 28px;
      }
      .login-field {
        margin-bottom: 20px;
      }
      .login-field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--color-card-text);
        margin-bottom: 8px;
      }
      .login-field input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid var(--color-card-border);
        background: var(--color-bg);
        color: var(--color-card-text);
        font-size: 15px;
        font-family: var(--font-body);
        outline: none;
        transition: border-color 0.2s;
        box-sizing: border-box;
      }
      .login-field input:focus {
        border-color: var(--teal);
      }
      .login-field input::placeholder {
        color: var(--color-muted);
        opacity: 0.6;
      }
      .login-pw-wrap {
        position: relative;
      }
      .login-pw-wrap input {
        padding-right: 48px;
      }
      .login-pw-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: var(--color-muted);
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s;
      }
      .login-pw-toggle:hover {
        color: var(--color-card-text);
      }
      .login-error {
        color: #ef4444;
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
        text-align: center;
        padding: 10px;
        background: rgba(239, 68, 68, 0.08);
        border-radius: 8px;
      }
      .login-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        font-family: var(--font-body);
        cursor: pointer;
        transition: all 0.2s;
        background: var(--teal);
        color: #fff;
      }
      .login-btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }
      .login-back {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }
      .login-back a {
        font-size: 13px;
        color: var(--color-muted);
        text-decoration: none;
        transition: color 0.2s;
      }
      .login-back a:hover { color: var(--teal); }

      /* Footer minimal for login page */
      .login-footer {
        text-align: center;
        padding: 20px;
        font-size: 12px;
        color: var(--color-muted);
        border-top: 1px solid var(--color-card-border);
      }
      .login-footer a {
        color: var(--teal);
        text-decoration: none;
      }

      @media (max-width: 480px) {
        .login-card { padding: 32px 24px; }
      }
    </style>
  </head>

<body class="login-page">
  <!-- Navbar -->
  <header class="nav-glass">
    <div class="nav-glass-inner">
      <a class="nav-glass-brand" href="/">
        Scholarify<sup class="text-xs" style="font-size:0.5em;vertical-align:super">®</sup>
      </a>
      <nav class="nav-glass-links">
        <a href="/">Beranda</a>
        <a href="/layanan">Layanan</a>
        <a href="/program">Program</a>
        <a href="/tim">Tim</a>
        <a href="/testimoni">Testimoni</a>
        <a href="/blog">Berita</a>
        <a href="/kontak">Kontak</a>
      </nav>
      <div class="nav-glass-actions">
        <a href="https://e-ujian.com/Scholarify" target="_blank" rel="noreferrer" class="btn-journey">TryOut</a>
        <button class="nav-hamburger" id="navHamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <nav class="nav-mobile" id="navMobile">
      <a href="/">Beranda</a>
      <a href="/layanan">Layanan</a>
      <a href="/program">Program</a>
      <a href="/tim">Tim</a>
      <a href="/testimoni">Testimoni</a>
      <a href="/blog">Berita</a>
      <a href="/kontak">Kontak</a>
    </nav>
  </header>

  <!-- Login Form -->
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <a href="/">Scholarify<sup>®</sup></a>
        <p>Panel Admin</p>
      </div>
      <h1 class="login-title">Login</h1>
      <p class="login-subtitle">Masukkan password admin untuk mengakses panel kelola konten.</p>

      <div id="login-error" class="login-error"></div>

      <form id="loginForm" autocomplete="off">
        <div class="login-field">
          <label for="password">Password</label>
          <div class="login-pw-wrap">
            <input type="password" id="password" name="password" placeholder="Masukkan password admin" required autofocus />
            <button type="button" class="login-pw-toggle" id="pwToggle" title="Tampilkan/Sembunyikan password" tabindex="-1">
              <svg id="pwEyeOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="pwEyeClosed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" id="loginBtn" class="login-btn">Login</button>
      </form>

      <div class="login-back">
        <a href="/">← Kembali ke Beranda</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="login-footer">
    &copy; 2026 Scholarify. All rights reserved.
  </div>

  <script>document.documentElement.classList.add('light');</script>
  <script>
    (function() {
      var form = document.getElementById('loginForm');
      var btn = document.getElementById('loginBtn');
      var errEl = document.getElementById('login-error');
      var pwInput = document.getElementById('password');
      var pwToggle = document.getElementById('pwToggle');
      var eyeOpen = document.getElementById('pwEyeOpen');
      var eyeClosed = document.getElementById('pwEyeClosed');

      if (pwToggle) {
        pwToggle.addEventListener('click', function() {
          var isPassword = pwInput.type === 'password';
          pwInput.type = isPassword ? 'text' : 'password';
          eyeOpen.style.display = isPassword ? 'none' : '';
          eyeClosed.style.display = isPassword ? '' : 'none';
        });
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var pw = pwInput.value.trim();
        if (!pw) {
          showErr('Masukkan password.');
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Memproses...';
        errEl.style.display = 'none';

        fetch('/api/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        })
        .then(function(r) {
          console.log('Login response status:', r.status);
          return r.json();
        })
        .then(function(data) {
          console.log('Login response:', data);
          if (data.success) {
            showErr('');
            errEl.style.display = 'none';
            btn.textContent = 'Berhasil! Mengalihkan...';
            btn.style.background = '#14B8A6';
            try { localStorage.setItem('scholarify_logged_in', '1'); } catch (e) {}
            setTimeout(function() { window.location.href = '/?admin=1'; }, 500);
          } else {
            showErr(data.error || 'Password salah. Coba lagi.');
            btn.disabled = false;
            btn.textContent = 'Login';
          }
        })
        .catch(function(err) {
          console.error('Login error:', err);
          showErr('Terjadi kesalahan jaringan. Coba lagi.');
          btn.disabled = false;
          btn.textContent = 'Login';
        });
      });

      function showErr(msg) {
        errEl.textContent = msg;
        errEl.style.display = 'block';
      }
    })();
  </script>
  <script>
    (function() {
      var hamburger = document.getElementById('navHamburger');
      var navMobile = document.getElementById('navMobile');
      if (!hamburger || !navMobile) return;
      hamburger.addEventListener('click', function() {
        hamburger.classList.toggle('active');
        navMobile.classList.toggle('open');
      });
      navMobile.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() {
          hamburger.classList.remove('active');
          navMobile.classList.remove('open');
        });
      });
    })();
  </script>
</body>
</html>
